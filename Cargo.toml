[package]
name = "tfhe-nand-poc"
version = "0.1.0"
edition = "2021"
description = "Minimal PoC of homomorphic NAND using the TFHE-rs library"
license = "MIT"

[dependencies]
tfhe = { version = "1.4", features = ["integer"] }

[profile.release]
codegen-units = 1
lto = false
opt-level = 1        # instead of default 3
